# SGME 官方适配器能力面对账表
#
# 定位：SGME 每新增一个 agent 可消费能力（= 一个 MCP 工具）就新增一个基准项；
#       八个官方适配器（hermes / dsh / doubao / mimo / workbuddy / zcode / codex / claude-code）**平级**，必须在同一批工作内评估对齐。
#       背景见《SGME-接入契约》§2 与 Backlog ST-42。
#       注（T-283）：HTTP 包通道（GET /v1/skills/{name}/package）不入工具面基线；四家 CLI 实现（fetch）登记于各自 extra。
#       注（接口对齐批次）：技能缓存/附件五工具（skill_catalog_version / skill_manifest /
#       skill_file_get / skill_file_put / skill_lint）是 MCP 工具面的一部分，已入基线；
#       整包通道仍是「通道」而非工具，维持不入基线（缓存闭环靠 manifest + 单文件读，见 D-59/T-404）。
#
# 用法：
#   python scripts/adapter_parity.py            # 日常检查（未声明缺口 = 失败；待补齐 = 警告）
#   python scripts/adapter_parity.py --strict   # 发布门禁（待补齐同样算失败）
#   python scripts/adapter_parity.py --json     # 机器可读输出
#
# 纪律：**每一处缺口都必须显式落一处声明**，否则视为漂移（失败）。三种声明：
#   exemptions  —— 永久豁免：能力语义上不该由该适配器承担，必须写理由
#   passthrough —— 通配通道代偿：如 mcp_raw 直调，必须写通道与理由
#   pending     —— 已登记待补齐：必须带 Backlog 任务号；--strict 下同样失败，
#                  因此「pending 清零」是相关任务的验收标准，不能长期挂账
#
# 名字口径：除 aliases 外，所有比对都用「剥掉适配器前缀后的规范名」。
version: 1

# ---------- 基准：唯一真源 = MCP 工具面 ----------
baseline:
  file: sgme/mcp_server.py
  pattern: '\{"name":\s*"([a-z_]+)"'
  note: MCP 工具面即 SGME agent 能力全集

# ---------- 八个平级适配器：解析规则 ----------
adapters:
  hermes:
    file: adapters/hermes/__init__.py
    pattern: '"name":\s*"([a-z_]+)"'
    strip_prefix: sgme_          # 工具名统一带 sgme_ 前缀
    note: memory.provider 槽位 Python 插件（Hermes 常驻）
  dsh:
    file: adapters/dsh/sgme-bridge/lib/index.js
    pattern: 'name:\s*"([a-z_]+)"'
    exclude: [sgme]              # /sgme 斜杠命令（lib/index.js 内注册），非工具
    note: Cordis TS 原生插件（dsh 常驻）
  doubao:
    file: adapters/doubao/scripts/sgme_client.py
    pattern: '^    def ([a-z_]+)\('
    exclude: [__init__, _http, _mcp]   # 内部方法（`_` 开头的名字一律不计）
    note: Skill + Python 客户端；工具面 = 客户端方法 + CLI 命令（SKILL.md 指示 agent 调用）
    # 第二接口面：豆包 agent 实际是按 SKILL.md 调 CLI 的，
    # 方法存在但 CLI 没入口 = 能力黑洞（T-172 实测过这个坑），故单独对账
    secondary_face:
      file: adapters/doubao/scripts/sgme_client.py
      pattern: '"cli":\s*"([a-z0-9_-]+)"'
      name_rule: dash                  # 基准名 x_y → CLI 名 x-y
  mimo:
    file: adapters/mimo/scripts/sgme_client.py
    pattern: '^    def ([a-z_]+)\('
    exclude: [__init__, _http, _mcp]
    note: MiMo Desktop Skill + Python 客户端（原生 MCP 优先，CLI 兜底）
    secondary_face:
      file: adapters/mimo/scripts/sgme_client.py
      pattern: '"cli":\s*"([a-z0-9_-]+)"'
      name_rule: dash
  workbuddy:
    file: adapters/workbuddy/scripts/sgme_client.py
    pattern: '^    def ([a-z_]+)\('
    exclude: [__init__, _http, _mcp]
    note: WorkBuddy Skill + Python 客户端（原生 MCP 优先，CLI 兜底；从 mcp.json 零配置继承地址与密钥）
    secondary_face:
      file: adapters/workbuddy/scripts/sgme_client.py
      pattern: '"cli":\s*"([a-z0-9_-]+)"'
      name_rule: dash
  zcode:
    file: adapters/zcode/scripts/sgme_client.py
    pattern: '^    def ([a-z_]+)\('
    exclude: [__init__, _http, _mcp]
    note: ZCode Skill + Python 客户端（自律型；从 ~/.zcode/cli/config.json 的 sgme server 零配置继承，含 import_history 历史补导入）
    secondary_face:
      file: adapters/zcode/scripts/sgme_client.py
      pattern: '"cli":\s*"([a-z0-9_-]+)"'
      name_rule: dash
  codex:
    file: adapters/codex/codex_sgme/mcp_proxy.py
    dynamic_forwarder:
      reason: "Codex stdio 代理动态转发远端 SGME MCP 工具面，不维护静态工具清单"
      require_patterns:
        - 'remote\.list_tools\(\)'
        - 'remote\.call_tool\('
    note: Codex MCP stdio 代理（远端 tools/list 与 tools/call 动态透传）
  claude-code:
    file: adapters/claude-code/claude_sgme/mcp_proxy.py
    dynamic_forwarder:
      reason: "Claude Code stdio 代理动态转发远端 SGME MCP 工具面，不维护静态工具清单"
      require_patterns:
        - 'remote\.list_tools\(\)'
        - 'remote\.call_tool\('
    note: Claude Code MCP stdio 代理（远端 tools/list 与 tools/call 动态透传）+ SessionStart/Stop/SessionEnd 原生 hooks

# ---------- 名称不同但语义等价的映射 ----------
aliases:
  search:
    hermes: sgme_memory_search
    dsh: memory_search
    doubao: search
    mimo: search
    workbuddy: search
    zcode: search

# ---------- 永久豁免（能力语义上不该由该适配器承担）----------
exemptions:
  agent_onboarding:
    hermes: provider 槽位接入，无 MCP 握手环节，「连接即发现」引导工具无落点
    dsh: 原生插件接入，无 MCP 握手环节，同上
  append:
    hermes: sync_turn 每轮自动入库（含 tool 去重）；agent 手写 L0 会破坏查重与幂等语义
    dsh: session-sync 自动入库；手写 L0 破坏查重与幂等（T-168 定）
  # D-67：技能候选池是**管理面**运维能力（转入/审核会决定技能库内容），
  # 由 HTTP /v1/admin/skill-candidates 承担；agent 会话面不应替用户做入库决策，
  # 故六个静态适配器统一豁免（Codex/Claude Code 动态代理仍完整透传，不影响管理面可用性）。
  skill_candidate_pending:
    hermes: 管理面审核队列，HTTP /v1/admin/skill-candidates/pending 承担；agent 会话不做入库决策
    dsh: 同上（管理面，非会话面能力）
    doubao: 同上（管理面，非会话面能力）
    mimo: 同上（管理面，非会话面能力）
    workbuddy: 同上（管理面，非会话面能力）
    zcode: 同上（管理面，非会话面能力）
  skill_candidate_list:
    hermes: 管理面候选池查询，HTTP /v1/admin/skill-candidates 承担
    dsh: 同上（管理面，非会话面能力）
    doubao: 同上（管理面，非会话面能力）
    mimo: 同上（管理面，非会话面能力）
    workbuddy: 同上（管理面，非会话面能力）
    zcode: 同上（管理面，非会话面能力）
  skill_candidate_adopt:
    hermes: 转入候选会写审核台账，属管理员动作；HTTP 管理端点承担
    dsh: 同上（需 admin key 的管理动作）
    doubao: 同上（需 admin key 的管理动作）
    mimo: 同上（需 admin key 的管理动作）
    workbuddy: 同上（需 admin key 的管理动作）
    zcode: 同上（需 admin key 的管理动作）
  skill_candidate_review:
    hermes: 审核决策（accepted/ignored）决定技能库内容，属管理员动作；HTTP 管理端点承担
    dsh: 同上（需 admin key 的管理动作）
    doubao: 同上（需 admin key 的管理动作）
    mimo: 同上（需 admin key 的管理动作）
    workbuddy: 同上（需 admin key 的管理动作）
    zcode: 同上（需 admin key 的管理动作）

# ---------- 通配通道代偿 ----------
# 形如：
#   doubao:
#     channel: mcp_raw
#     tools: [some_tool]
#     reason: "..."
passthrough: {}

# ---------- 基线之外的自有工具（登记，不算漂移）----------
extra:
  hermes: [conversation_search, role_save, role_delete]  # conversation_search=查 sessions 原始层；role_save/role_delete=角色卡写侧（T-211）
  dsh: [conversation_search]  # 查 sessions 原始层（T-207 ③ 实现；T-226 重建产物后对 dsh 运行时生效）
  doubao: [events_pull, events_after, wiki_raw, mcp_raw, describe, fetch]
  mimo: [events_pull, events_after, wiki_raw, mcp_raw, describe, fetch]
  workbuddy: [events_pull, events_after, wiki_raw, mcp_raw, describe, fetch]
  zcode: [events_pull, events_after, wiki_raw, mcp_raw, describe, fetch]

# ---------- 已登记待补齐（必须带任务号）----------
# 形如：
#   hermes:
#     task: T-171
#     tools: [some_tool]
#     note: "..."
pending: {}
