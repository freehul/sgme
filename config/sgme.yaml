l1:
  chunk_size: 5000
  overlap: 1000
l15:
  prescreen:
    enabled: true
    vector_top_k: 50
    dimension_top_n: 50
    fallback: skip_conflict   # embed 不可达 → 跳过冲突检测直接 store（防全量召回烧钱）
refine:
  refine_on_append: false
  # 用户指定专用提炼 LLM（2026-08-18，T-53 免费托底）：
  # 显式 override 优先于 agent 声明（resolve.py 策略规则 1）——dsh agent 曾注册
  # agent_model=deepseek/deepseek-v4-flash 劫持提炼链（5279 次 deepseek 消耗），
  # 此配置强制主链 zhipu 免费；2026-08-20 起降级链移除 deepseek 备用（省钱），限流整批滞留重试。
  llm_override:
    provider: zhipu
    model: glm-4.7-flash
    max_tokens: 8192
  batch_scan:
    enabled: true
    interval_min: 60   # 2026-08-20：10→60min，白天减少撞 zhipu 限流频率（会话结束 refine_trigger 仍即时提炼）
l2:
  max_scenes: 200
  warn_thresholds:
    yellow: 150
    orange: 180
    red: 200
search:
  vector:
    enabled: true
    provider: local   # 本地优先（2026-08-20 生产定案）：NAS ollama bge-m3 1024 维，零费用、隐私本地
    model: bge-m3
    base_url: http://192.168.10.10:11434/v1   # NAS ollama OpenAI 兼容端点（SGME 容器经宿主 IP 访问）
    # api_key_env 留空——本地 Ollama 无需鉴权
    fallbacks:
      - provider: siliconflow   # 云端免费降级备用（同 1024 维，切换不重灌索引）
        model: BAAI/bge-m3
        base_url: https://api.siliconflow.cn/v1
        api_key_env: SILICONFLOW_API_KEY
  rrf:
    k: 60
backup:
  enabled: true
  schedule: 04:00
  level: incremental
  dir: data/backups
  keep_full: 7
  remote_dir: ''  # 异地目录（本机另一盘/NAS 挂载）；空 = 跳过。部署时用 SGME_BACKUP_REMOTE env 注入
  raw_cold_days: 90
wiki:
  enabled: true
skills_hub:
  enabled: true
  path: ''
  mode: copy
  sync_policy: manual
  remote:
    source: ${SGME_SKILLS_HUB_REMOTE}
    cache: ./cache/skills/
    branch: main
    conflict_policy: local_wins
    timeout_s: 60
    backup_refs: true
logging:
  level: INFO
  format: console
dream:
  enabled: true
  schedule: 03:00
  max_files: 200
  ttl_mark: true
  archive_days: 90
  report_dir: data/reports/
care:
  enabled: true
  persona_max_chars: 2000
