providers:
  deepseek:
    name: deepseek
    display_name: DeepSeek 云端
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY_SGME
    provider_type: openai_compat
    default_model: deepseek-v4-flash
    context_window: 1048576
    timeout_s: 120
    max_retries: 3
    health_endpoint: /models
    health_interval_s: 60
    vector_capable: false
  zhipu:
    name: zhipu
    display_name: 智谱（免费托底）
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    provider_type: openai_compat
    default_model: glm-4.7-flash
    context_window: 200000
    timeout_s: 60
    max_retries: 3
    health_endpoint: /models
    health_interval_s: 60
    vector_capable: false
# volc-plan（火山方舟）已移除（2026-08-18 用户定：向量统一走硅基流动免费档）
  agnes:
    name: agnes
    display_name: Agnes AI（免费兜底）
    base_url: https://apihub.agnes-ai.cn/v1
    api_key_env: AGNESAI_API_KEY
    provider_type: openai_compat
    default_model: agnes-2.5-flash
    context_window: 200000
    timeout_s: 60
    max_retries: 3
    health_endpoint: /models
    health_interval_s: 60
    vector_capable: false
  siliconflow:
    name: siliconflow
    display_name: 硅基流动（向量，免费模型）
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    provider_type: openai_compat
    default_model: BAAI/bge-m3
    models:
    - BAAI/bge-m3
    - BAAI/bge-large-zh-v1.5
    - Qwen/Qwen3-Embedding-0.6B
    timeout_s: 60
    max_retries: 3
    vector_capable: true
  nvidia:
    name: nvidia
    display_name: NVIDIA（向量，免费端点）
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    provider_type: openai_compat
    default_model: nv-embed-v1
    models:
    - nv-embed-v1
    - nv-embedqa-e5-v5
    timeout_s: 60
    max_retries: 3
    vector_capable: true
