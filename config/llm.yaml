# SGME LLM 配置 v0.4（降级链，D15）
# 编排层（v0.7 §13）：只保留链结构与链级参数；
#   供应商连接字段（base_url/api_key_env/context_window/...）见 config/providers.yaml，
#   由 sgme/config.py 加载时按 provider 名注入链节点（节点内联字段优先，兼容旧格式）。
# 提供商无关（ST-22①）：默认链每个节点均可替换为任何 OpenAI 兼容提供商——
#   供应商连接字段见 config/providers.yaml（品牌由用户选，本文件不绑定品牌）。
#   当前节点仅作示例占位；换供应商时改 providers.yaml 连接字段，
#   并按所选模型调整 model/max_tokens/sampling/extra_body。
# 密钥不落盘：引用环境变量名（铁律）
# 链结构语义：
#   第一级：云端 OpenAI 兼容主模型（长上下文，剪枝后任何会话整段放得下）
#   第二级：rule drop_batch（全链失败兜底，抛 LLMUnavailable）
# 注：lm-studio 本地模型已从供应商与降级链移除（2026-08-14 用户决策：
#   本地模型能力与向量维度不足，提炼统一走云端 DeepSeek）
# ⚠️ 写回注意：WebUI 降级链编辑（write_llm_config）只覆盖 chains 段并自动剥离
#   连接字段（CHAIN_ORCH_FIELDS 白名单），本文件注释会在写回时丢失（pyyaml 限制），
#   需人工维护时以此版为基线。
chains:
  refinement:
    # 2026-08-22 用户定主序：agnes/siliconflow 免费档 1-4s 放前；
    # zhipu 免费 key 失效，2026-08-29 移出降级链（避免烧付费 ZHIPU_API_KEY）。
    - provider: agnes          # 第一优先（2026-08-22 用户定）：Agnes 免费档，1-4s
      model: agnes-2.5-flash
      max_tokens: 16384
    - provider: siliconflow    # 第二优先：硅基流动 deepseek-ai/DeepSeek-V4-Flash 免费，1-3s
      model: deepseek-ai/DeepSeek-V4-Flash
      max_tokens: 16384
    - provider: rule
      rule: drop_batch

rules:
  timeout_s: 240
  # 2026-08-22：5→2（免费兜底 agnes 已就位）——zhipu 1305 时快速切兜底，
  # 不再等 5 次退避 ~2min 才降级（旧设计只有 drop_batch，多扛重试有价值；
  # 有免费兜底后快速切换收益更大）
  max_retries: 2
  fallback_on: [timeout, 5xx, connection_error, auth_error, context_overflow, rate_limit]
  # 指数退避（ST-23⑥）：fallback_on 错误的重试间隔 =
  #   min(base_s × 2^(attempt-1), max_s) + [0, jitter_s)
  #   429 响应带 Retry-After 头时取 max(退避值, Retry-After)
  backoff:
    base_s: 3.0     # 首次重试等待 3s（智谱官方建议：避免立即高频重试；序列 3s/6s/12s）
    max_s: 60.0     # 退避封顶（2026-08-20：20s→60s，1305 过载恢复数十秒级，多扛两轮减少降级）
    jitter_s: 0.5   # 抖动防惊群（批量连环撞限流场景）
  # 调用层节流器（ST-23⑥）：批量提炼时平滑请求速率（令牌桶），防连环撞限流
  #   rps：每秒请求数；burst：桶容量（1 = 无突发，严格平滑）
  #   默认 0.5 rps ≈ 30 req/min（取常用云端限流 60 req/min 的一半作安全余量）
  throttle:
    enabled: true
    rps: 0.5
    burst: 1
  context:
    reserved_output: 4096
    prompt_overhead: 0.08   # 提示词开销比例（8%），64K → 5K，预算 ≈ 55K
  allowed_models:
    deny_prefixes: [pro, reasoner, thinking]
    deny_exact: [gemma-4-12b-qat]
