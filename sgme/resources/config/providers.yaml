providers:
  deepseek:
    name: deepseek
    display_name: DeepSeek 云端
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY_SGME
    provider_type: openai_compat
    default_model: deepseek-v4-flash
    context_window: 1048576
    timeout_s: 120
    max_retries: 3
    health_endpoint: /models
    health_interval_s: 60
    vector_capable: false
# volc-plan（火山方舟）已移除（2026-08-18 用户定：向量统一走硅基流动免费档）
# ⚠️ 2026-09-01 实测（B144）：硅基流动 deepseek-ai/DeepSeek-V4-Flash 已转付费档（$0.13/M 输入），
#    LLM 备用已改免费档 THUDM/GLM-4-9B-0414——严禁把 V4-Flash 写回降级链（会烧钱）
# zhipu（智谱）段于 2026-08-29 删除：免费 key 失效，且降级链已移出 zhipu 节点（避免残留引用误触发付费）
  agnes:
    name: agnes
    display_name: Agnes AI（免费兜底）
    base_url: https://apihub.agnes-ai.cn/v1
    api_key_env: AGNESAI_API_KEY
    provider_type: openai_compat
    default_model: agnes-2.5-flash
    context_window: 200000
    timeout_s: 60
    max_retries: 3
    health_endpoint: /models
    health_interval_s: 60
    vector_capable: false
  siliconflow:
    name: siliconflow
    display_name: 硅基流动（免费档，向量+LLM 备用）
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    provider_type: openai_compat
    default_model: BAAI/bge-m3
    models:
    - BAAI/bge-m3
    - BAAI/bge-large-zh-v1.5
    - Qwen/Qwen3-Embedding-0.6B
    timeout_s: 60
    max_retries: 3
    vector_capable: true
  nvidia:
    name: nvidia
    display_name: NVIDIA（向量，免费端点）
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    provider_type: openai_compat
    default_model: nv-embed-v1
    models:
    - nv-embed-v1
    - nv-embedqa-e5-v5
    timeout_s: 60
    max_retries: 3
    vector_capable: true
