    created_at: '2026-10-28T20:28:13Z'
    note: 'SGME2.0 候选（未激活，active 仍为 @working）：D-66 七值 type + certainty + subject 必填（含三组正反对照）；D-67 route 按来源硬分流（助手科普不进记忆池、
      用户改写草稿按 memory、他人引文按 others）；D-68 软遗忘 forget 字段（正文不复述被忘内容，解析层重写兜底）。persona13 实测（本文件自身跑 27 块）：
      88 条记忆、误存 0%、软遗忘 21/23=91%、偏好召回 13/22（人工判定）/ 7/22（同一 LLM 裁判）、语言漂移 1 条、3 次重试全部成功。
      **扩样 6 persona（2026-10-29）**：160 块 0 失败、433 条记忆；七人设合计误存 0.4%、软遗忘 92.4%、偏好召回 30.2%（严格）/46.3%（含部分）→ 召回未达 60% 门禁。
      已知缺口（启用前必须落解析层强制）：①forget 正文仍含主题关键词 → 用 forget.topic 重写正文 ②**他人主体系统性丢失**（36 条 who=others 样本 0 条正确归属，521 条记忆仅 15 条 others）→ 需补"用户主动关心/提及他人"判据
      ③1 条非法 type「计划」→ enum 白名单校验 ④语言逐条判。启用方式：prompts_cli activate l1_extraction v008'
