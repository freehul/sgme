name: full
display_name: 全量模式
memory_types: [identity, family, social, values, skills, tech_stack, preferences, habits, environment, focus, goals, status]  # T-203 G2：style 维度并入 preferences（14→13 维度）
token_budget: 1200
sections:
  - title: "👤 用户画像"
    query:
      dimensions: [identity, family, social, values]
      match: any  # T-203：4 维 AND 结构性不可能（单记忆最多 3 标签），必须 OR
      priority_min: 70
      limit: 10
  - title: "🧩 能力与技术栈"
    query:
      dimensions: [skills, tech_stack]
      priority_min: 60
      limit: 8
  - title: "⚙️ 偏好与风格"
    query:
      dimensions: [preferences, habits, environment]
      match: any  # T-203：4 维 AND 结构性不可能（原 4 维含 style，style 已并入 preferences）
      priority_min: 60
      limit: 8
  - title: "🔥 当前状态"
    query:
      dimensions: [focus, goals, status]  # 2026-08-18：projects/tasks 移除
      match: any
      ttl_filter: true
      sort: updated_at DESC
      limit: 8
