# SGME Docker Compose — 单机 / NAS 一键部署
# 用法：
#   1. 复制 .env.example 为 docker.env，填入真实密钥
#   2. docker compose up -d --build
#   3. 验证：curl http://localhost:9910/v1/health
#
# 密钥经 env_file（docker.env）注入，与项目根 dsh 适配器的 .env 隔离；
# 数据卷 sgme-data 持久化 SGME_HOME（data/raw/logs/roles/config），升级不丢数据。

services:
  sgme:
    build: .
    image: sgme:1.0.0b4-nas-upd2
    container_name: sgme
    restart: unless-stopped
    ports:
      - "9910:9910"   # HTTP API + WebUI
      - "9913:9913"   # MCP streamable HTTP
    environment:
      # 用户数据根（挂载卷）
      SGME_HOME: /data
      # 监听 0.0.0.0（容器内访问必须，否则外部无法连接）
      SGME_HOST: 0.0.0.0
      SGME_PORT: "9910"
      # 时区（日志/日报/备份定时用本地时区）
      TZ: Asia/Shanghai
    # T-155：SYS_PTRACE 允许容器内 py-spy 抓栈（MCP 9913 僵死取证，正常运行为零开销能力位）
    cap_add:
      - SYS_PTRACE
    env_file:
      - docker.env   # 密钥（不入 git）：DEEPSEEK_API_KEY / VOLC_API_KEY / SGME_ADMIN_KEY / SGME_AGENT_KEY
    volumes:
      - sgme-data:/data
    healthcheck:
      # 2026-08-29 B123：urlopen 内层 timeout 必须大于 /v1/health 实际延迟（内部
      # 同步探测 LLM 首链，agnes 实测 5.5s）——曾为 3s 必然超时误判 unhealthy
      # T-155：健康判据双探针——9910 health 200 且 9913 MCP 无 key POST /mcp 秒回 403。
      # 此前只探 9910，MCP 独立线程僵死（TCP 通、应用层不回包）时容器仍 healthy，
      # 自动重启永不触发（2026-09-07/08 实锤）。403=应用层活着；任何异常/超时=非零退出=unhealthy。
      # ⚠️ 必须保持单行：群晖 compose 执行链会把多行标量折叠成单行致 SyntaxError（2026-09-08 实锤），
      # 故用 http.client 低层读状态码（无 try/except，异常自然非零退出）。
      test: ["CMD", "python", "-c", "import http.client,sys;c=http.client.HTTPConnection('127.0.0.1',9910,timeout=25);c.request('GET','/v1/health');r1=c.getresponse().status;c.close();m=http.client.HTTPConnection('127.0.0.1',9913,timeout=10);m.request('POST','/mcp',body='{}',headers={'Content-Type':'application/json'});r2=m.getresponse().status;m.close();sys.exit(0 if r1==200 and r2==403 else 1)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 15s

volumes:
  sgme-data:
