name: sgme
version: "0.1.0"
description: "SGME 记忆引擎 Hermes 桥接——长期记忆沉淀+溯源检索（瘦桥接，重活全在 SGME daemon）"
author: "freehul"
license: MIT
provider_class: "SGMEProvider"
config:
  base_url: "http://192.168.10.10:9910"  # 2026-08-16 搬家：本机 Gateway 退役，切 NAS
  # 密钥不落盘（2026-08-11 安全加固）：删除明文 key，回退环境变量
  # SGME_AGENT_KEY / SGME_ADMIN_KEY（见 __init__.py _DEFAULT_* 解析）
  inject_mode: "daily"
  inject_max_tokens: 800
  capture_enabled: true
  refine_on_end: true  # 2026-08-12 恢复：提炼成本修复完成
