name: sgme
version: "1.10.5"  # 版本口径跟随 SGME 版本（1.10.5 = catalog 准入合规：密钥走 agent.secret_scope + requires_hermes 声明；1.10.4 = 离线自救卡 + 八适配器平级落地），见 README
requires_hermes: ">=0.22.0"  # catalog 规则14：与 plugin-catalog/sgme.yaml 同步声明；旧版 Hermes 只认 manifest 这份
description: "SGME 记忆引擎 Hermes 桥接——长期记忆沉淀+溯源检索+技能/wiki/三池治理+沟通角色（42 工具，瘦桥接，重活全在 SGME daemon）"
author: "freehul"
license: MIT
provider_class: "SGMEProvider"
config:
  base_url: "http://127.0.0.1:9910"  # 本机回环默认；生产用环境变量 SGME_BASE_URL 指向远端 SGME
  # 密钥不落盘（2026-08-11 安全加固）：不写明文 key，只读环境变量
  # SGME_AGENT_KEY / SGME_ADMIN_KEY（见 __init__.py _DEFAULT_* 解析）
  inject_mode: "daily"
  inject_max_tokens: 800
  capture_enabled: true
  refine_on_end: true
  # T-211（2026-09-27）：以上行为项与「沟通角色」均可在桌面「设置 → 记忆与上下文 → 持久记忆」
  # 的 SGME 面板配置（落 $HERMES_HOME/sgme/config.json，开新会话生效）；密钥只走环境变量。
