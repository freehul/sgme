name: sgme
version: "1.3.1"  # 版本口径跟随 SGME 版本（1.3.1 = 未消费 care 信号 TTL=3 天，T-200），见 README
description: "SGME 记忆引擎 Hermes 桥接——长期记忆沉淀+溯源检索+技能/wiki/三池治理（40 工具，瘦桥接，重活全在 SGME daemon）"
author: "freehul"
license: MIT
provider_class: "SGMEProvider"
config:
  base_url: "http://127.0.0.1:9910"  # 本机回环默认；生产用环境变量 SGME_BASE_URL 指向远端 SGME
  # 密钥不落盘（2026-08-11 安全加固）：不写明文 key，只读环境变量
  # SGME_AGENT_KEY / SGME_ADMIN_KEY（见 __init__.py _DEFAULT_* 解析）
  inject_mode: "daily"
  inject_max_tokens: 800
  capture_enabled: true
  refine_on_end: true
