# Mount the CodeGraph bridge into a DSH profile.
# 把 colbymchenry/codegraph（本地代码知识图谱 CLI）暴露为 dsh 工具。
# bin 默认自动探测（DSH_CODEGRAPH_BIN 环境变量可覆盖），不写死单机路径；
# projectPath 默认跟随 dsh 启动目录（process.cwd()），工具参数 path 可覆盖。
# 目标项目目录需已执行过 `codegraph init` 建过索引。
- insert:
    - id: codegraph
      name: "dsh-codegraph"
      config:
        queryLimit: 10
