# Mount the SGME bridge into a DSH profile.
# SGME Gateway 地址/key 由 cordis.yml 的 config 注入（install.py 写入 .env 后由 dsh 加载）。
# dev key 仅限本机回环测试；生产环境请用 install.py 注册 agent 后覆盖。
- insert:
    - id: sgme
      name: "dsh-sgme"
      config:
        baseUrl: !!js process.env.SGME_BASE_URL ?? 'http://127.0.0.1:9910'
        # key 通过环境变量注入（符合 SGME 密钥不落盘铁律 #10）：
        # SGME_AGENT_KEY / SGME_ADMIN_KEY 由 install.py 注册 agent 后写入
        # <cwd>/.env 或 $DSH_HOME/.env，dsh 启动时物化进 process.env。
        agentKey: !!js process.env.SGME_AGENT_KEY ?? ''
        adminKey: !!js process.env.SGME_ADMIN_KEY ?? ''
        agentId: dsh
        injectMode: daily
        # 2026-11-05：首步自动注入当前激活角色人设（伴侣/管家/朋友/导师；换皮不换芯）
        roleInject: true
        injectMaxTokens: 800
        searchLimit: 5
        # projectHint 用于首步注入时检索"项目相关记忆"；缺省按会话 cwd 目录名推断（可选）
        # projectHint: !!js process.env.SGME_PROJECT_HINT ?? ''
        syncOnTurnEnd: true
        turnBatchSize: 1
        # F2（2026-11-05）：事件提醒类型白名单（精确 type 或 前缀_*）。
        # 缺省只提醒异常告警与关怀信号；memory_updated 这类高频事件不再挤进系统提示
        # （需要查看时仍可 signal_pull）。想彻底关掉事件提醒可写空数组。
        eventNotifyTypes:
          - anomaly_warn
          - care_*
