<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>T-150 评测进度</title>
<style>
  /* 主题变量优先用宿主注入（聊天内嵌预览），无则回落到独立浏览器可用值 */
  body {
    color: var(--foreground, #e8e8ea);
    font-family: var(--app-font, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif);
    margin: 0; padding: 14px; font-size: 13px;
    background: transparent;
  }
  h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; letter-spacing: .3px; }
  .muted { color: var(--muted-foreground, #9aa0a6); }
  .bar-wrap { background: var(--border, #33363b); border-radius: 6px; height: 10px; overflow: hidden; margin: 6px 0; }
  .bar { height: 100%; background: var(--accent, #4c9aff); transition: width .4s ease; }
  .card {
    border: 1px solid var(--border, #33363b); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px; background: var(--card, transparent);
  }
  .card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; margin-top: 8px; }
  .cell { border: 1px solid var(--border, #33363b); border-radius: 6px; padding: 6px 8px; }
  .cell .k { font-size: 11px; color: var(--muted-foreground, #9aa0a6); }
  .cell .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .live { background: #2ecc71; box-shadow: 0 0 7px #2ecc71; }
  .stale { background: #e74c3c; box-shadow: 0 0 7px #e74c3c; }
  .unknown { background: #8a8f98; }
  pre {
    background: rgba(128,128,128,.08); border: 1px solid var(--border, #33363b); border-radius: 6px;
    padding: 8px 10px; font-size: 11.5px; line-height: 1.55; overflow-x: auto; margin: 8px 0 0;
    white-space: pre-wrap; word-break: break-all; max-height: 200px;
  }
  .hdr { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; margin-bottom: 4px; }
  .done-banner {
    border: 1px solid #2ecc71; border-radius: 8px; padding: 8px 12px;
    color: #2ecc71; font-weight: 600; margin-bottom: 10px;
  }
</style>
</head>
<body>
<h1>T-150 评测进度 <span class="muted" id="sub">连接中…</span></h1>
<div id="state" class="muted">正在读取…</div>
<div id="cards"></div>
<pre id="log">（等待日志…）</pre>

<script>
// API 地址：默认指向笔记本上的监视服务；可用 ?api=http://host:port 覆盖
const params = new URLSearchParams(location.search);
const API = (params.get("api") || "http://192.168.10.141:8899").replace(/\/$/, "");
const POLL_MS = 2000;

const fmtDur = (s) => {
  if (s === null || s === undefined) return "—";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h} 小时 ${m} 分` : (m > 0 ? `${m} 分 ${s % 60} 秒` : `${s} 秒`);
};
const nz = (v) => (v === null || v === undefined ? "—" : v);

function render(d) {
  const alive = d.alive;
  const dotCls = alive === null ? "unknown" : (alive ? "live" : "stale");
  const dotTxt = alive === null ? "未知（无心跳）" : (alive ? "运行中" : `心跳陈旧 ${Math.round(d.heartbeat_age_s)} 秒`);

  document.getElementById("sub").textContent =
    `run_id ${d.run_id || "—"} ｜ 服务时间 ${d.server_time}`;

  document.getElementById("state").innerHTML =
    `<span class="dot ${dotCls}"></span>${dotTxt} ｜ 已运行 ${fmtDur(d.elapsed_s)}`;

  if (d.done) {
    const b = document.createElement("div");
    b.className = "done-banner";
    b.textContent = "评测已收尾（日志中出现评分）";
    document.getElementById("state").after(b);
  }

  const wrap = document.getElementById("cards");
  wrap.innerHTML = "";
  (d.arms || []).forEach((a) => {
    const ing = a.state ? a.state.ingested : null;
    const ref = a.state ? a.state.refined : null;
    const pct = (ing && ref !== null) ? Math.min(100, Math.round((ref / ing) * 100)) : 0;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${a.arm} ｜ 提炼进度 ${ref === null ? "—" : ref} / ${ing === null ? "—" : ing}（${pct}%）</h2>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
      <div class="grid">
        <div class="cell"><div class="k">L0 落盘</div><div class="v">${nz(a.session_raw_files)}</div></div>
        <div class="cell"><div class="k">记忆</div><div class="v">${nz(a.memories)}</div></div>
        <div class="cell"><div class="k">标签</div><div class="v">${nz(a.memory_tags)}</div></div>
        <div class="cell"><div class="k">向量</div><div class="v">${nz(a.memory_vectors)}</div></div>
        <div class="cell"><div class="k">L2 场景</div><div class="v">${nz(a.scenes)}</div></div>
        <div class="cell"><div class="k">提炼轮次</div><div class="v">${nz(a.refine_runs)}</div></div>
      </div>`;
    wrap.appendChild(card);
  });

  document.getElementById("log").textContent = (d.log_tail || []).join("\n") || "（暂无日志）";
}

async function tick() {
  try {
    const r = await fetch(`${API}/status`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById("state").innerHTML =
      `<span class="dot stale"></span>无法连接监视服务（${API}）：${e.message}`;
  }
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
