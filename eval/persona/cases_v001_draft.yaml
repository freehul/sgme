  - id: pa-002
    category: personality_trait
    source: synthetic
    difficulty: medium
    conversation: |
      user: 我做任何事都习惯先列清单，确认完再动手。
    expected:
      memories:
        - content: "用户做事习惯先列清单再动手"
          dimensions: [habits]
          main_dimension: habits
          memory_type: persona
          certainty: confirmed
          subject: self
          route: memory
      traits: ["先计划后动手"]
      causal: []
    trap: "性格特质只写原文倾向，不要直接映射大五域；单句自述算 habit 而非结论性人格"
    review: { drafted_by: agent, user_checked: false }

  - id: pa-003
