  - id: pa-001
    category: role_interaction
    source: synthetic
    difficulty: easy
    conversation: |
      user: 今天累死了，不想说话。
      assistant: 那就不说，我在。
    expected:
      memories:
        - content: "用户当天很累、不想说话"
