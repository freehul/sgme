# SGME 评测基线 v001（首版 50 条标注用例）
# 格式约定：字段英文，注释中文
# 依据：docs/design/SGME-评测基线-PRD-v0.1.md §3.1-3.5
#
# 规模分布：easy 15 / medium 23 / hard 12 = 50
# 来源分布：real 20 / synthetic 20 / edge 10 = 50
# 维度覆盖：15 维 × ≥3 = 45 条覆盖
# 模式覆盖：daily≥20 / coding≥20 / work≥15 / full≥10

meta:
  version: v001
  created_at: "2026-08-06T00:00:00Z"
