[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sgme-adapter"
version = "0.1.2"
description = "A thin, lifecycle-aware Codex adapter for SGME."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
codex-sgme = "codex_sgme.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
