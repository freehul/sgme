[project]
name = "claude-sgme-adapter"
version = "0.1.0"
description = "Claude Code 的 SGME（拾光记忆引擎）适配器：MCP stdio 动态透传 + 会话生命周期 hooks"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
claude-sgme = "claude_sgme.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_sgme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
