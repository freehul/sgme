[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgme"
version = "1.2.1"
description = "SGME — 拾光记忆引擎：单用户 Agent 记忆引擎 Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "sqlite-vec>=0.1,<1.0",
    "requests>=2.31,<3.0",
    "mcp>=1.28,<2.0",
    "jieba>=0.42.1,<1.0",
    "zstandard>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sgme*"]
exclude = ["tests*", "scripts*", "docs*"]

# T-142：程序资源内迁至 sgme/resources/，随 wheel 一并分发（否则 pip install . 后启动报
# FileNotFoundError: config/llm.yaml）。仅打包 yaml/txt 资源，密钥 .env 已被 .gitignore 排除。
[tool.setuptools.package-data]
sgme = ["resources/**/*.yaml", "resources/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
