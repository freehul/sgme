[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgme"
version = "1.0.1"
description = "SGME — 拾光记忆引擎：单用户 Agent 记忆引擎 Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sqlite-vec>=0.1",
    "requests>=2.31",
    "mcp>=1.28,<2.0",
    "jieba>=0.42.1",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sgme*"]
exclude = ["tests*", "scripts*", "docs*", "config*", "registry*", "templates*", "prompts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
