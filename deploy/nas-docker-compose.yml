# SGME NAS 部署 compose（群晖 Docker / Container Manager）— 部署真相源模板
#
# ⚠️ 本文件是 NAS 生产 compose 的模板（真相源在项目 git）。
# NAS 上实际生效的是 /vol1/1000/Docker/sgme/docker-compose.yml（bind mount + 已 load 镜像），
# 由本模板复制并替换 {{IMAGE_TAG}} 后使用；NAS 部署目录非 git 仓库（B64 遗留），
# 任何部署变更必须：改本项目 git → push → NAS 拉取 → 更新 NAS compose 副本。
#
# 用法：
#   1. 项目 git 拉取最新代码
#   2. NAS 构建镜像：docker build -t sgme:{{IMAGE_TAG}} .（在本项目目录）
#      （或 docker load 传输已构建镜像）
#   3. 复制本模板到 /vol1/1000/Docker/sgme/docker-compose.yml，替换 {{IMAGE_TAG}}
#   4. docker compose up -d（用固化镜像重建，数据卷 bind mount 不动）
#
# 密钥：env_file docker.env（gitignore 忽略，勿提交）——DEEPSEEK_API_KEY / VOLC_API_KEY /
#       SGME_ADMIN_KEY / SGME_AGENT_KEY
# 数据卷：bind mount /vol1/1000/Docker/sgme/data → /data（SGME_HOME），升级/重建不丢数据
# skills-hub：bind mount /vol1/1000/git/skills-hub.git → /git/skills-hub.git（file:// 直访）

services:
  sgme:
    image: sgme:{{IMAGE_TAG}}
    container_name: sgme
    restart: unless-stopped
    ports:
      - "9910:9910"   # HTTP API + WebUI
      - "9913:9913"   # MCP streamable HTTP
    # T-155：SYS_PTRACE 允许容器内 py-spy 抓栈（MCP 9913 僵死取证，正常运行为零开销能力位）
    cap_add:
      - SYS_PTRACE
    environment:
      SGME_HOME: /data
      SGME_HOST: 0.0.0.0
      SGME_PORT: "9910"
      TZ: Asia/Shanghai
    env_file:
      - docker.env
    volumes:
      - /vol1/1000/Docker/sgme/data:/data
      - /vol1/1000/git/skills-hub.git:/git/skills-hub.git
    healthcheck:
      # 2026-08-29 B123：urlopen 内层 timeout 必须大于 /v1/health 实际延迟（内部
      # 同步探测 LLM 首链，agnes 实测 5.5s）——曾为 3s 必然超时误判 unhealthy。
      # ⚠️ 2026-09-08 T-155 审计：NAS 实际生效 compose 的 timeout 已在 B123 修正为 25s/30s，
      # 本模板当时漏同步（3s/5s 为错误旧值），本次对齐。
      # T-155：健康判据双探针——9910 health 200 且 9913 MCP 无 key POST /mcp 秒回 403。
      # 此前只探 9910，MCP 独立线程僵死时容器仍 healthy，自动重启永不触发（2026-09-07/08 实锤）。
      # ⚠️ 必须保持单行：群晖 compose 执行链会把多行标量折叠成单行致 SyntaxError（2026-09-08 实锤），
      # 故用 http.client 低层读状态码（无 try/except，异常自然非零退出）。
      test: ["CMD", "python", "-c", "import http.client,sys;c=http.client.HTTPConnection('127.0.0.1',9910,timeout=25);c.request('GET','/v1/health');r1=c.getresponse().status;c.close();m=http.client.HTTPConnection('127.0.0.1',9913,timeout=10);m.request('POST','/mcp',body='{}',headers={'Content-Type':'application/json'});r2=m.getresponse().status;m.close();sys.exit(0 if r1==200 and r2==403 else 1)"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 15s
