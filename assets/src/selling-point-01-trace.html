<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(56, 89, 255, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% -20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #0b0f2a 0%, #12173a 45%, #1b1440 100%);
    position: relative;
    color: #e8ecff;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 6, 18, 0.55) 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .title { position: absolute; top: 48px; left: 0; right: 0; text-align: center; }
  .title .en {
    font-size: 22px; letter-spacing: 8px; color: rgba(0, 212, 255, 0.85);
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
  }
  .title .cn {
    margin-top: 10px; font-size: 44px; font-weight: 700;
    background: linear-gradient(90deg, #7ee8ff, #c9b8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(90, 160, 255, 0.35);
  }
  .title .sub { margin-top: 8px; font-size: 19px; color: rgba(220, 230, 255, 0.55); letter-spacing: 3px; }

  .card {
    background: rgba(18, 26, 60, 0.55);
    border: 1.5px solid rgba(0, 212, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(0, 180, 255, 0.12), inset 0 0 22px rgba(60, 120, 255, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .ico { font-size: 52px; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5)); }
  .card .nm { margin-top: 10px; font-size: 21px; font-weight: 600; }
  .card .role { margin-top: 4px; font-size: 13px; color: rgba(200, 220, 255, 0.55); }

  .footer {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    font-size: 15px; letter-spacing: 5px; color: rgba(180, 200, 255, 0.45);
  }

  /* 溯源：横向链路 */
  .chain { position: absolute; top: 290px; left: 90px; right: 90px; height: 260px; }
  .chain .card { position: absolute; top: 40px; width: 240px; height: 180px; }
  .chain .c1 { left: 0; }
  .chain .c2 { left: 340px; }
  .chain .c3 { left: 680px; }
  .chain .c4 { left: 1020px; }
  .chain .arrow {
    position: absolute; top: 120px; width: 110px; height: 2px;
    background: linear-gradient(90deg, rgba(0,212,255,0.7), rgba(0,212,255,0.25));
  }
  .chain .arrow::after {
    content: ""; position: absolute; right: 0; top: -5px;
    border-left: 10px solid rgba(0, 212, 255, 0.8); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .chain .a1 { left: 236px; } .chain .a2 { left: 576px; } .chain .a3 { left: 916px; }
  .chain .label { position: absolute; top: 12px; width: 240px; text-align: center; font-size: 14px; color: rgba(180, 205, 255, 0.6); letter-spacing: 2px; }
  .chain .l1 { left: 0; } .chain .l2 { left: 340px; } .chain .l3 { left: 680px; } .chain .l4 { left: 1020px; }

  /* 反向追溯虚线 */
  .trace-line {
    position: absolute; top: 470px; left: 250px; right: 250px; height: 0;
    border-top: 2px dashed rgba(126, 232, 255, 0.75);
    box-shadow: 0 0 12px rgba(126, 232, 255, 0.4);
  }
  .trace-arrow {
    position: absolute; top: 452px; left: 224px;
    border-right: 12px solid rgba(126, 232, 255, 0.9); border-top: 9px solid transparent; border-bottom: 9px solid transparent;
    filter: drop-shadow(0 0 8px rgba(126, 232, 255, 0.8));
  }
  .trace-label {
    position: absolute; top: 492px; left: 0; right: 0; text-align: center;
    font-size: 17px; color: #7ee8ff; letter-spacing: 3px;
    text-shadow: 0 0 14px rgba(126, 232, 255, 0.6);
  }
  .trace-label .hl { color: #c9b8ff; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="title">
    <div class="en">TRACEABLE MEMORY</div>
    <div class="cn">记忆可溯源</div>
    <div class="sub">每条记忆都有来处</div>
  </div>

  <div class="chain">
    <div class="label l1">原始对话 · L0</div>
    <div class="label l2">场景聚合 · L2</div>
    <div class="label l3">记忆池 · L1</div>
    <div class="label l4">AI 画像</div>
    <div class="card c1"><div class="ico">📄</div><div class="nm">原始文件</div><div class="role">对话原文 · 永久保留</div></div>
    <div class="arrow a1"></div>
    <div class="card c2"><div class="ico">🗂️</div><div class="nm">场景</div><div class="role">叙事聚合</div></div>
    <div class="arrow a2"></div>
    <div class="card c3"><div class="ico">🏷️</div><div class="nm">记忆</div><div class="role">标签化事实</div></div>
    <div class="arrow a3"></div>
    <div class="card c4"><div class="ico">🤖</div><div class="nm">AI 画像</div><div class="role">注入即用</div></div>
  </div>

  <div class="trace-arrow"></div>
  <div class="trace-line"></div>
  <div class="trace-label">🔍 一键追溯 · <span class="hl">从 AI 的话 → 找到当时的原始对话</span></div>

  <div class="footer">EVERY MEMORY HAS A PROVENANCE · 每条记忆都有来处</div>
</body>
</html>
