<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(56, 89, 255, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% -20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #0b0f2a 0%, #12173a 45%, #1b1440 100%);
    position: relative;
    color: #e8ecff;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 6, 18, 0.55) 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .title { position: absolute; top: 48px; left: 0; right: 0; text-align: center; }
  .title .en {
    font-size: 22px; letter-spacing: 8px; color: rgba(0, 212, 255, 0.85);
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
  }
  .title .cn {
    margin-top: 10px; font-size: 44px; font-weight: 700;
    background: linear-gradient(90deg, #7ee8ff, #c9b8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(90, 160, 255, 0.35);
  }
  .title .sub { margin-top: 8px; font-size: 19px; color: rgba(220, 230, 255, 0.55); letter-spacing: 3px; }

  .card {
    background: rgba(18, 26, 60, 0.55);
    border: 1.5px solid rgba(0, 212, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(0, 180, 255, 0.12), inset 0 0 22px rgba(60, 120, 255, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .ico { font-size: 52px; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5)); }
  .card .nm { margin-top: 10px; font-size: 21px; font-weight: 600; }
  .card .role { margin-top: 4px; font-size: 13px; color: rgba(200, 220, 255, 0.55); }

  .footer {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    font-size: 15px; letter-spacing: 5px; color: rgba(180, 200, 255, 0.45);
  }

  /* 统一检索：上搜索框，下多源汇聚 */
  .searchbox {
    position: absolute; top: 210px; left: 50%; transform: translateX(-50%);
    width: 640px; height: 96px;
    background: rgba(18, 26, 60, 0.65);
    border: 2px solid rgba(0, 212, 255, 0.55);
    border-radius: 28px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 50px rgba(0, 180, 255, 0.3), inset 0 0 26px rgba(60, 120, 255, 0.1);
    display: flex; align-items: center; padding: 0 36px; gap: 20px;
  }
  .searchbox .mag { font-size: 44px; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.7)); }
  .searchbox .txt { flex: 1; font-size: 26px; color: rgba(220, 235, 255, 0.8); letter-spacing: 2px; }
  .searchbox .btn {
    font-size: 20px; color: #0b0f2a; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, #7ee8ff, #5ab8ff);
    padding: 12px 28px; border-radius: 18px;
    box-shadow: 0 0 24px rgba(126, 232, 255, 0.5);
  }
  .query {
    position: absolute; top: 330px; left: 0; right: 0; text-align: center;
    font-size: 18px; color: rgba(180, 205, 255, 0.6); letter-spacing: 2px;
  }

  .sources { position: absolute; top: 430px; left: 110px; right: 110px; height: 220px; }
  .sources .card { position: absolute; top: 20px; width: 280px; height: 180px; }
  .sources .s1 { left: 0; } .sources .s2 { left: 390px; } .sources .s3 { left: 780px; }
  .sources .s4 { left: 1170px; }
  .sources .line {
    position: absolute; top: 105px; height: 2px;
    background: linear-gradient(90deg, rgba(0,212,255,0.35), rgba(0,212,255,0.7));
  }
  .sources .line::after {
    content: ""; position: absolute; right: 0; top: -5px;
    border-left: 10px solid rgba(0, 212, 255, 0.8); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  }
  .sources .m1 { left: 276px; width: 118px; } .sources .m2 { left: 666px; width: 118px; } .sources .m3 { left: 1056px; width: 118px; }

  .result {
    position: absolute; top: 660px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: center;
    background: rgba(18, 26, 60, 0.5);
    border: 1.5px solid rgba(126, 232, 255, 0.4);
    border-radius: 16px;
    padding: 14px 30px;
    box-shadow: 0 0 24px rgba(126, 232, 255, 0.15);
  }
  .result .tag {
    font-size: 15px; padding: 6px 16px; border-radius: 20px;
    background: rgba(0, 212, 255, 0.15); border: 1px solid rgba(0, 212, 255, 0.4);
    color: #7ee8ff; letter-spacing: 1px;
  }
  .result .txt { font-size: 18px; color: rgba(220, 235, 255, 0.85); letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="title">
    <div class="en">UNIFIED SEARCH</div>
    <div class="cn">多源统一检索</div>
    <div class="sub">一个入口 · 全部记忆</div>
  </div>

  <div class="searchbox">
    <div class="mag">🔍</div>
    <div class="txt">搜索：任何问题……</div>
    <div class="btn">检索</div>
  </div>
  <div class="query">关键词 + 语义 + 标签 三重融合（RRF）</div>

  <div class="sources">
    <div class="card s1"><div class="ico">🏷️</div><div class="nm">记忆池</div><div class="role">L1.5 提炼记忆</div></div>
    <div class="line m1"></div>
    <div class="card s2"><div class="ico">🗂️</div><div class="nm">场景</div><div class="role">L2 叙事聚合</div></div>
    <div class="line m2"></div>
    <div class="card s3"><div class="ico">📚</div><div class="nm">知识库</div><div class="role">Wiki 页面</div></div>
    <div class="line m3"></div>
    <div class="card s4"><div class="ico">📄</div><div class="nm">Agent 记忆</div><div class="role">外部文件（规划中）</div></div>
  </div>

  <div class="result">
    <div class="tag">结果 1</div>
    <div class="txt">SGME 记忆引擎 · 来源：记忆池 · <span style="color:#7ee8ff">可追溯</span></div>
  </div>

  <div class="footer">ONE QUERY · ALL MEMORIES · 一次查询 · 全部记忆</div>
</body>
</html>
