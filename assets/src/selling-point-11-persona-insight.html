<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(56, 89, 255, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% -20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #0b0f2a 0%, #12173a 45%, #1b1440 100%);
    position: relative;
    color: #e8ecff;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 6, 18, 0.55) 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .title {
    position: absolute; top: 46px; left: 0; right: 0; text-align: center;
  }
  .title .en {
    font-size: 22px; letter-spacing: 8px; color: rgba(0, 212, 255, 0.85);
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
  }
  .title .cn {
    margin-top: 10px; font-size: 44px; font-weight: 700;
    background: linear-gradient(90deg, #7ee8ff, #c9b8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(90, 160, 255, 0.35);
  }
  .title .sub {
    margin-top: 8px; font-size: 19px; color: rgba(220, 230, 255, 0.55);
    letter-spacing: 3px;
  }

  /* 中央核心 */
  .core {
    position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%);
    width: 320px; height: 320px;
  }
  .core .halo {
    position: absolute; inset: -46px; border-radius: 50%;
    background: radial-gradient(circle, rgba(200, 120, 255, 0.28) 0%, rgba(140, 60, 220, 0.08) 45%, transparent 70%);
    animation: pulse 3.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .core .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(200, 150, 255, 0.95), rgba(120, 60, 200, 0.85) 60%, rgba(60, 25, 110, 0.9));
    border: 2px solid rgba(180, 120, 255, 0.7);
    box-shadow: 0 0 60px rgba(160, 90, 255, 0.5), inset 0 0 40px rgba(200, 150, 255, 0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .core .disc .brain { font-size: 84px; line-height: 1; filter: drop-shadow(0 0 18px rgba(180, 120, 255, 0.8)); }
  .core .disc .name { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .core .disc .tag { margin-top: 4px; font-size: 14px; color: rgba(235, 225, 255, 0.8); letter-spacing: 3px; }

  /* 左侧证据来源 */
  .left-label {
    position: absolute; left: 60px; top: 215px; width: 200px;
    font-size: 14px; letter-spacing: 3px; color: rgba(180, 120, 255, 0.7);
  }
  .src {
    position: absolute; left: 56px;
    width: 210px; height: 118px;
    background: rgba(18, 26, 60, 0.55);
    border: 1.5px solid rgba(180, 120, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(160, 90, 255, 0.12), inset 0 0 22px rgba(140, 60, 220, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .src .ico { font-size: 38px; filter: drop-shadow(0 0 10px rgba(180, 120, 255, 0.5)); }
  .src .nm { margin-top: 6px; font-size: 20px; font-weight: 600; }
  .src .role { margin-top: 3px; font-size: 12px; color: rgba(200, 220, 255, 0.55); letter-spacing: 1px; }
  .src.s1 { top: 270px; }
  .src.s2 { top: 402px; }
  .src.s3 { top: 534px; }

  /* 右侧洞察维度 */
  .right-label {
    position: absolute; right: 60px; top: 215px; width: 220px; text-align: right;
    font-size: 14px; letter-spacing: 3px; color: rgba(180, 120, 255, 0.7);
  }
  .node {
    position: absolute; right: 56px;
    width: 220px; height: 118px;
    background: rgba(18, 26, 60, 0.55);
    border: 1.5px solid rgba(180, 120, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(160, 90, 255, 0.12), inset 0 0 22px rgba(140, 60, 220, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .node .ico { font-size: 38px; filter: drop-shadow(0 0 10px rgba(180, 120, 255, 0.5)); }
  .node .nm { margin-top: 6px; font-size: 20px; font-weight: 600; }
  .node .role { margin-top: 3px; font-size: 12px; color: rgba(200, 220, 255, 0.55); letter-spacing: 1px; }
  .node.n1 { top: 270px; }
  .node.n2 { top: 402px; }
  .node.n3 { top: 534px; }

  /* 连接线 */
  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.links line {
    stroke: rgba(180, 120, 255, 0.5); stroke-width: 2;
    stroke-dasharray: 10 8; animation: flow 2.4s linear infinite;
  }
  @keyframes flow { to { stroke-dashoffset: -36; } }
  svg.links circle.dot { fill: #d4b8ff; filter: drop-shadow(0 0 6px rgba(180, 120, 255, 0.9)); }

  /* 底部标语 */
  .footer {
    position: absolute; bottom: 36px; left: 0; right: 0; text-align: center;
    font-size: 15px; letter-spacing: 5px; color: rgba(180, 200, 255, 0.45);
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <!-- 连接线：左三证据 → 核心 (800,477)；核心 → 右三维度 -->
  <svg class="links" viewBox="0 0 1600 900">
    <line x1="266" y1="329" x2="640" y2="430" />
    <line x1="266" y1="461" x2="640" y2="477" />
    <line x1="266" y1="593" x2="640" y2="524" />
    <line x1="960" y1="430" x2="1334" y2="329" />
    <line x1="960" y1="477" x2="1334" y2="461" />
    <line x1="960" y1="524" x2="1334" y2="593" />
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 266,329 L 640,430" /></circle>
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 266,461 L 640,477" /></circle>
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 266,593 L 640,524" /></circle>
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 960,430 L 1334,329" /></circle>
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 960,477 L 1334,461" /></circle>
    <circle class="dot" r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M 960,524 L 1334,593" /></circle>
  </svg>

  <div class="title">
    <div class="en">PERSONA INSIGHT</div>
    <div class="cn">人格洞察</div>
    <div class="sub">不只记住你的事 · 还懂你这个人</div>
  </div>

  <div class="left-label">从对话中积累证据</div>
  <div class="src s1"><div class="ico">💬</div><div class="nm">日常对话</div><div class="role">观点与情绪表达</div></div>
  <div class="src s2"><div class="ico">📋</div><div class="nm">决策记录</div><div class="role">选择背后的逻辑</div></div>
  <div class="src s3"><div class="ico">⚙️</div><div class="nm">工作方式</div><div class="role">习惯与质量标准</div></div>

  <div class="core">
    <div class="halo"></div>
    <div class="disc">
      <div class="brain">🧬</div>
      <div class="name">人格画像</div>
      <div class="tag">EVIDENCE-WEIGHTED · 证据加权倾向</div>
    </div>
  </div>

  <div class="right-label">洞察注入 · 每月校准</div>
  <div class="node n1"><div class="ico">🎯</div><div class="nm">决策风格</div><div class="role">倾向，不轻下结论</div></div>
  <div class="node n2"><div class="ico">🔍</div><div class="nm">做事习惯</div><div class="role">质量标准与节奏</div></div>
  <div class="node n3"><div class="ico">🧭</div><div class="nm">MBTI 趣味评测</div><div class="role">每月自动校准</div></div>

  <div class="footer">IT KNOWS WHO YOU ARE · 它懂你这个人</div>
</body>
</html>
