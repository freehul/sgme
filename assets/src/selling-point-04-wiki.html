<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(56, 89, 255, 0.25) 0%, transparent 60%),
      radial-gradient(ellipse at 80% -20%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
      linear-gradient(135deg, #0b0f2a 0%, #12173a 45%, #1b1440 100%);
    position: relative;
    color: #e8ecff;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 6, 18, 0.55) 100%);
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 160, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }
  .title { position: absolute; top: 48px; left: 0; right: 0; text-align: center; }
  .title .en {
    font-size: 22px; letter-spacing: 8px; color: rgba(0, 212, 255, 0.85);
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.6);
  }
  .title .cn {
    margin-top: 10px; font-size: 44px; font-weight: 700;
    background: linear-gradient(90deg, #7ee8ff, #c9b8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(90, 160, 255, 0.35);
  }
  .title .sub { margin-top: 8px; font-size: 19px; color: rgba(220, 230, 255, 0.55); letter-spacing: 3px; }

  .card {
    background: rgba(18, 26, 60, 0.55);
    border: 1.5px solid rgba(0, 212, 255, 0.35);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 0 30px rgba(0, 180, 255, 0.12), inset 0 0 22px rgba(60, 120, 255, 0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .ico { font-size: 52px; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5)); }
  .card .nm { margin-top: 10px; font-size: 21px; font-weight: 600; }
  .card .role { margin-top: 4px; font-size: 13px; color: rgba(200, 220, 255, 0.55); }

  .footer {
    position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
    font-size: 15px; letter-spacing: 5px; color: rgba(180, 200, 255, 0.45);
  }

  /* wiki：左侧投入 → 中间加工 → 右侧知识图谱 */
  .inbox { position: absolute; top: 220px; left: 90px; width: 380px; height: 440px; }
  .inbox .card { position: absolute; width: 170px; height: 120px; }
  .inbox .i1 { left: 0; top: 0; }
  .inbox .i2 { right: 0; top: 0; }
  .inbox .i3 { left: 105px; top: 160px; }
  .inbox .plus1 { position: absolute; left: 168px; top: 38px; font-size: 30px; color: rgba(126,232,255,0.8); }
  .inbox .plus2 { position: absolute; left: 168px; top: 38px; font-size: 30px; color: rgba(126,232,255,0.8); display:none; }
  .inbox .plus3 { position: absolute; left: 200px; top: 198px; font-size: 30px; color: rgba(126,232,255,0.8); }

  .proc {
    position: absolute; top: 240px; left: 560px; width: 420px; height: 400px;
    background: rgba(18, 26, 60, 0.45);
    border: 1.5px solid rgba(0, 212, 255, 0.25);
    border-radius: 22px;
    padding: 30px 34px;
    backdrop-filter: blur(12px);
  }
  .proc .p-title { font-size: 20px; color: #7ee8ff; letter-spacing: 3px; margin-bottom: 20px; text-shadow: 0 0 12px rgba(126,232,255,0.5); }
  .proc .item {
    display: flex; align-items: center; gap: 14px;
    font-size: 17px; color: rgba(220, 235, 255, 0.85);
    padding: 12px 16px; margin-bottom: 12px;
    background: rgba(0, 60, 120, 0.25);
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 12px;
  }
  .proc .item .t { font-size: 22px; }

  .graph {
    position: absolute; top: 210px; right: 80px; width: 480px; height: 470px;
    display: flex; align-items: center; justify-content: center;
  }
  .graph .g-card { position: absolute; padding: 14px 22px; border-radius: 14px; font-size: 16px; letter-spacing: 1px; }
  .graph .g1 { top: 40px; left: 90px; }
  .graph .g2 { top: 60px; right: 60px; }
  .graph .g3 { top: 200px; left: 20px; }
  .graph .g4 { top: 220px; right: 20px; }
  .graph .g5 { bottom: 30px; left: 130px; }
  .graph .center {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(120, 220, 255, 0.95), rgba(30, 90, 220, 0.85) 60%, rgba(20, 40, 120, 0.9));
    border: 2px solid rgba(0, 212, 255, 0.7);
    box-shadow: 0 0 50px rgba(0, 180, 255, 0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .graph .center .ico { font-size: 56px; filter: drop-shadow(0 0 14px rgba(0, 212, 255, 0.8)); }
  .graph .center .nm { font-size: 16px; font-weight: 700; margin-top: 4px; }
  svg.graph-links { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.graph-links line { stroke: rgba(0, 212, 255, 0.35); stroke-width: 1.5; stroke-dasharray: 6 6; }

  .bot-note {
    position: absolute; top: 700px; left: 0; right: 0; text-align: center;
    font-size: 18px; color: rgba(220, 235, 255, 0.75); letter-spacing: 2px;
  }
  .bot-note .hl { color: #7ee8ff; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="title">
    <div class="en">BUILT-IN WIKI</div>
    <div class="cn">本地知识库 Wiki</div>
    <div class="sub">你的资料库 · AI 也看得懂</div>
  </div>

  <div class="inbox">
    <div class="card i1"><div class="ico">📄</div><div class="nm">文件</div><div class="role">Markdown / PDF</div></div>
    <div class="plus1">+</div>
    <div class="card i2"><div class="ico">🔗</div><div class="nm">网页</div><div class="role">URL 抓取</div></div>
    <div class="card i3"><div class="ico">🖼️</div><div class="nm">图片</div><div class="role">截图 / 照片</div></div>
    <div class="plus3">+</div>
  </div>

  <div class="proc">
    <div class="p-title">▍自动加工</div>
    <div class="item"><span class="t">🏷️</span>自动分类 · 打标签</div>
    <div class="item"><span class="t">🔗</span>相似推荐 · 建立关联</div>
    <div class="item"><span class="t">🧠</span>提炼要点 · 可检索引用</div>
  </div>

  <div class="graph">
    <svg class="graph-links" viewBox="0 0 480 470">
      <line x1="240" y1="235" x2="130" y2="80" />
      <line x1="240" y1="235" x2="370" y2="100" />
      <line x1="240" y1="235" x2="70" y2="240" />
      <line x1="240" y1="235" x2="410" y2="260" />
      <line x1="240" y1="235" x2="190" y2="420" />
    </svg>
    <div class="center"><div class="ico">📚</div><div class="nm">知识图谱</div></div>
    <div class="card g-card g1">📘 人格评测</div>
    <div class="card g-card g2">🔬 竞品调研</div>
    <div class="card g-card g3">🧠 心理架构</div>
    <div class="card g-card g4">⚙️ 工具笔记</div>
    <div class="card g-card g5">📖 学习笔记</div>
  </div>

  <div class="bot-note">AI 可检索 · 浏览器可浏览 · 一键导出带图 HTML · <span class="hl">局域网 HTTP 直连</span></div>

  <div class="footer">KNOWLEDGE YOUR AI CAN READ · AI 读得懂的知识库</div>
</body>
</html>
