name: Tests

# G-1（2026-09-24 深度审查观察项）：补测试流水线——此前 CI 只有 Gitee 镜像同步，
# 回归完全依赖本地全量 pytest + 本地钩子（钩子只查密钥与能力面对账，不跑测试）。
# 本工作流：main 推送 + PR + 手动触发时跑全量测试套件（零 LLM/网络消耗，约 3~6 分钟）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          # 依赖来源 = pyproject（对外依赖契约），不是 requirements.txt（本机锁定环境）；
          # 这样 CI 同时充当「新用户照声明装依赖能不能用」的门禁。
          pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          mkdir -p tmp
          python -m pytest -q --junitxml=tmp/junit.xml

      - name: Run adapter self-tests
        run: |
          # 逐个适配器独立进程跑：多个适配器都有同名 tests/test_client.py，
          # 合并收集会撞 pytest「import file mismatch」（无 __init__.py 的同名模块）。
          for d in adapters/*/tests; do
            echo "=== $d ==="
            python -m pytest "$d" -q
          done

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: tmp/junit.xml
          if-no-files-found: ignore
