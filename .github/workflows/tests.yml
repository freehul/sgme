name: Tests

# G-1（2026-09-24 深度审查观察项）：补测试流水线——此前 CI 只有 Gitee 镜像同步，
# 回归完全依赖本地全量 pytest + 本地钩子（钩子只查密钥与能力面对账，不跑测试）。
# 本工作流：main 推送 + PR + 手动触发时跑全量测试套件（零 LLM/网络消耗，约 3~6 分钟）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # 固定 24.04 而非 ubuntu-latest：GitHub 将于 2026-10-19 起把 latest 迁到 Ubuntu 26，
    # 固定版本防镜像换代带来的无预告行为漂移（升级窗口由本仓显式决定）。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          # 依赖来源 = pyproject（对外依赖契约），不是 requirements.txt（本机锁定环境）；
          # 这样 CI 同时充当「新用户照声明装依赖能不能用」的门禁。
          pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          mkdir -p tmp
          python -m pytest -q --junitxml=tmp/junit.xml

      - name: Run adapter self-tests
        run: |
          # 逐个适配器独立进程跑：多个适配器都有同名 tests/test_client.py，
          # 合并收集会撞 pytest「import file mismatch」（无 __init__.py 的同名模块）。
          for d in adapters/*/tests; do
            echo "=== $d ==="
            python -m pytest "$d" -q
          done

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: tmp/junit.xml
          if-no-files-found: ignore

  # ============================================================
  # T-226 防复发（P1-9）：dsh 桥接 lib/ 是入库提交的构建产物，vitest 全 mock
  # 永不加载 lib——「本地全绿、产物旧」在本地没有任何信号（conversation_search
  # 曾静默缺失 5 天）。本 job 重建产物并断言与提交内容零 diff。
  #
  # 为什么 Python 门禁（tests/test_adapter_freshness.py）不够：
  # 该门禁做的是工具名/模块级比对（改 src 忘了 build 的常见形态必红），
  # 而「改了现有实现没重建」这类内容级陈旧只有「重建 + diff」能兜住——
  # 这也是审计报告 P3 的明确建议。两条线互补，互不替代。
  #
  # 构建可复现性依据：pnpm 版本由 package.json 的 packageManager 字段钉死
  # （corepack 读取），tsdown/typescript/rolldown 由 pnpm-lock.yaml 钉死，
  # 产物不含绝对路径——同工具链重建逐字节一致（本地已用历史提交 a46d823
  # 回放验证：重建产物 sha256 与入库 blob 完全一致）。
  # ⚠️ 2026-09-30 首跑实证：产物含 //#region node_modules/.pnpm/<pkg>_<hash> 注释，
  # 该虚拟店哈希随 pnpm 大版本/平台而变（本地 pnpm9 26 位 vs CI pnpm11 32 位）——
  # 比对前归一路径避免跨平台误红；内容级差异照旧必红（见下方 Assert 步骤）。
  # ============================================================
  dsh-bundle-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24（LTS）自带 corepack；tsdown 要求 ^22.18.0 || >=24.11.0。
      # 注意 Node 24 起为仍分发 corepack 的最高版本（25+ 已移除，改由 npm 独立安装）。
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable pnpm（版本 = packageManager 字段，corepack 自动取 11.21.0）
        run: corepack enable

      - name: Install bridge deps
        working-directory: adapters/dsh/sgme-bridge
        run: pnpm install --frozen-lockfile

      - name: Rebuild bundle
        working-directory: adapters/dsh/sgme-bridge
        run: pnpm run build

      - name: Assert committed lib is fresh
        run: |
          # 比对：重建产物 vs 入库版本（HEAD），逐文件。
          # 先归一两类环境噪声（2026-09-30 首跑实证的误红根因）：
          #   ①//#region 注释里的 .pnpm 虚拟店目录名——<pkg>@<ver>_<peer 集>_<hash>
          #     的哈希与截断形态随 pnpm 大版本/平台变化（v9 26 位 vs v11 32 位）；
          #   ②保留 <pkg>@<ver> 前缀不归一——依赖集合若真变（增删包）照样必红。
          # 内容级差异（改了实现没重建）不受归一影响，照旧拦截。
          RE='s#(\.pnpm/[^_/]+)_[^/]*/node_modules#\1_<STOREV>/node_modules#g'
          fail=0
          for f in adapters/dsh/sgme-bridge/lib/*; do
            [ -f "$f" ] || continue
            if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "::error::dsh 产物出现未入库的新文件：$f（本地 build 后提交产物）"
              fail=1; continue
            fi
            git show "HEAD:$f" | sed -E "$RE" > /tmp/committed.norm
            sed -E "$RE" "$f" > /tmp/rebuilt.norm
            if ! diff -q /tmp/committed.norm /tmp/rebuilt.norm >/dev/null; then
              echo "::error::dsh 桥接 $f 与 src 不同步（已归一 pnpm 虚拟店路径后仍不一致）——本地 pnpm -C adapters/dsh/sgme-bridge run build 后提交产物"
              diff /tmp/committed.norm /tmp/rebuilt.norm | head -60
              fail=1
            fi
          done
          untracked="$(git ls-files --others --exclude-standard -- adapters/dsh/sgme-bridge/lib)"
          if [ -n "$untracked" ]; then
            echo "::error::dsh 桥接 lib/ 出现未入库的新产物文件：$untracked"
            fail=1
          fi
          [ "$fail" = "1" ] && exit 1
          echo "OK：dsh 桥接 lib/ 与 src 同步（已归一 pnpm 虚拟店路径）"
