name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ["**"] # T-154：tag 推送也要同步 Gitee（releases/latest 依赖 Gitee tag 源）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee (main + tags)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          # token 直接嵌 URL 由 GitHub 自动打码；GITEE_USER 用 freehul
          git remote add gitee "https://freehul:${GITEE_TOKEN}@gitee.com/freehul/sgme.git"
          # tag 触发时 checkout 为 detached HEAD（无本地 main）→ 先显式建/复位 main 分支再推
          # （B161：v1.2.0 tag 同步曾因 `src refspec main does not match any` 失败）
          git checkout -B main "$GITHUB_SHA" 2>/dev/null || git checkout -B main
          git push gitee main --force
          git push gitee --tags --force
