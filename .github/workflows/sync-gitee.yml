name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ["**"] # T-154：tag 推送也要同步 Gitee（releases/latest 依赖 Gitee tag 源）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync to Gitee (main + tags)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          # token 直接嵌 URL 由 GitHub 自动打码；GITEE_USER 用 freehul
          git remote add gitee "https://freehul:${GITEE_TOKEN}@gitee.com/freehul/sgme.git"

          # 重试包裹（B204）：Gitee 从 GitHub runner 出发偶发连接重置——2026-09-24 合并 PR 时
          # `main -> main` 已推成功、`--tags` 卡 2 分钟后 exit 128（Recv failure: Connection reset
          # by peer），复跑即绿。两条 push 都是幂等（--force），故各重试 3 次、退避 5/15 秒，
          # 仍失败才判红（网络抖动不该长期记成工作流红）。
          push_with_retry() {
            desc="$1"; shift
            n=0
            for delay in 0 5 15; do
              [ "$delay" -gt 0 ] && sleep "$delay"
              n=$((n + 1))
              if "$@"; then
                echo "[sync] ${desc} 成功（第 ${n} 次尝试）"
                return 0
              fi
              echo "[sync] ${desc} 第 ${n} 次尝试失败"
            done
            echo "[sync] ${desc} 重试 3 次仍失败"
            return 1
          }

          # main 推送仅限主分支事件（B235/T-244）：tag 事件下 $GITHUB_SHA = tag 指向的提交，
          # 旧逻辑用 checkout -B main "$GITHUB_SHA" 强推——v1.7.6 tag 同步把 main 从
          # 合并提交 286bbe7 回退到版本号提交 2d5e36e（501bb83/286bbe7 两提交丢失）。
          # tag 事件只同步 tags；main 的每次变更都有自身分支事件的同步，无需 tag 场景补推。
          # （原 B161「tag 触发无本地 main → 显式建 main」路径随之移除，避免旧坑复发）
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            git checkout -B main "$GITHUB_SHA"
            push_with_retry "main 推送" git push gitee main --force
          else
            echo "[sync] 非 main 分支事件（ref=${GITHUB_REF}）：仅同步 tags，不推 main"
          fi

          push_with_retry "tag 推送" git push gitee --tags --force
